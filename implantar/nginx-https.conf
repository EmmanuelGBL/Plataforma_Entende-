# Entende+ — site da API, instalado por implantar/instalar.sh.
# access_log e error_log desligados: os dois gravariam o IP de quem abre a
# atividade da criança (RN05).
server {
	listen 80;
	listen [::]:80;
	server_name DOMINIO_AQUI;
	access_log off;
	error_log /dev/null;

	location /.well-known/acme-challenge/ { root ACME_AQUI; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name DOMINIO_AQUI;
	access_log off;
	error_log /dev/null;

	ssl_certificate /etc/letsencrypt/live/DOMINIO_AQUI/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/DOMINIO_AQUI/privkey.pem;

	# 15 MB de material (RNF08), mais a folga do formulário.
	client_max_body_size 16m;

	location /api/ {
		proxy_pass http://127.0.0.1:PORTA_AQUI;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto https;
		# A adaptação é síncrona e pode demorar minutos.
		proxy_read_timeout 600s;
	}

	# A interface fica no GitHub Pages.
	location / { return 302 PAGES_AQUI/Plataforma_Entende-/; }
}
